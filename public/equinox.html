<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Today's Games</title>
    <style>
      :root {
        --tile-gap: 4px; /* space between matchups */
        --cell-gap: 4px; /* space between home and away cell */
        --logo-size: 78%; /* logo size inside its cell */
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #grid {
        display: flex;
        flex-direction: column;
        gap: var(--tile-gap);
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      .row {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        gap: var(--tile-gap);
      }
      .tile {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        gap: var(--cell-gap);
        text-decoration: none;
        outline-offset: -3px;
        transition:
          filter 0.15s ease,
          transform 0.15s ease;
      }
      .tile:hover,
      .tile:focus-visible {
        filter: brightness(1.15);
      }
      .tile:active {
        transform: scale(0.985);
      }
      .tile:focus-visible {
        outline: 3px solid #fff;
      }
      .cell {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cell img {
        width: var(--logo-size);
        height: var(--logo-size);
        object-fit: contain;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }
      #empty {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #555;
        font:
          500 14px/1 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        letter-spacing: 0.08em;
      }
      #empty.show {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <div id="empty">NO GAMES TODAY</div>

    <script>
      (function () {
        "use strict";

        var LEAGUES = [
          { key: "nfl", path: "football/nfl", web: "nfl/game" },
          { key: "mlb", path: "baseball/mlb", web: "mlb/game" },
          { key: "nba", path: "basketball/nba", web: "nba/game" },
          { key: "nhl", path: "hockey/nhl", web: "nhl/game" },
          { key: "wnba", path: "basketball/wnba", web: "wnba/game" },
          {
            key: "ncaa",
            path: "football/college-football",
            web: "college-football/game",
          },
          { key: "mls", path: "soccer/usa.1", web: "soccer/match" },
          { key: "nwsl", path: "soccer/usa.nwsl", web: "soccer/match" },
        ];
        var API = "https://site.api.espn.com/apis/site/v2/sports/";
        var REFRESH_MS = 60 * 1000;
        var FALLBACK_BG = "#3c3c3c";
        var STATE_ORDER = { in: 0, pre: 1, post: 2 }; // live, upcoming, completed

        var gridEl = document.getElementById("grid");
        var emptyEl = document.getElementById("empty");
        var games = [];
        var signature = "";

        function sameLocalDay(a, b) {
          return (
            a.getFullYear() === b.getFullYear() &&
            a.getMonth() === b.getMonth() &&
            a.getDate() === b.getDate()
          );
        }

        // ---------- background color selection (checks the logo against each color) ----------
        var CLASH_RATIO = 1.8; // logo pixel vs background below this contrast ratio = "clashing"
        var BAD_CLASH = 0.3; // above this share, the best team color is too close to the logo

        function clean(c) {
          return (c || "").replace(/^#/, "").toLowerCase();
        }
        function isValid(c) {
          return /^[0-9a-f]{6}$/.test(c);
        }
        function isBlackOrWhite(c) {
          return c === "000000" || c === "ffffff";
        }

        // WCAG relative luminance from r,g,b (0-255)
        function lumRGB(r, g, b) {
          var v = [r, g, b].map(function (x) {
            x = x / 255;
            return x <= 0.04045
              ? x / 12.92
              : Math.pow((x + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
        }
        function lumHex(c) {
          return lumRGB(
            parseInt(c.substr(0, 2), 16),
            parseInt(c.substr(2, 2), 16),
            parseInt(c.substr(4, 2), 16),
          );
        }
        function ratio(l1, l2) {
          var hi = Math.max(l1, l2),
            lo = Math.min(l1, l2);
          return (hi + 0.05) / (lo + 0.05);
        }

        // Only the team's own two colors: alt first, then primary. Black/white team colors are kept
        // aside as "extra" and only used when the real colors would swallow the logo.
        function candidatesFor(team) {
          var all = [clean(team.alternateColor), clean(team.color)].filter(
            function (c, i, arr) {
              return isValid(c) && arr.indexOf(c) === i;
            },
          );
          var colored = all.filter(function (c) {
            return !isBlackOrWhite(c);
          });
          var extra = colored.length ? all.filter(isBlackOrWhite) : [];
          var list = colored.length ? colored : all;
          return {
            list: list.length ? list : [clean(FALLBACK_BG)],
            extra: extra,
          };
        }

        function clashShare(lums, bgHex) {
          var bl = lumHex(bgHex),
            n = 0,
            i;
          for (i = 0; i < lums.length; i++)
            if (ratio(lums[i], bl) < CLASH_RATIO) n++;
          return n / lums.length;
        }

        // lums = luminance of each opaque logo pixel (or null if the logo couldn't be read)
        function pickBg(c, lums) {
          if (!lums || !lums.length) return "#" + c.list[0];
          var best = null;
          c.list.forEach(function (hex, i) {
            var clash = clashShare(lums, hex);
            // alt color (first) keeps priority on a near tie
            if (!best || clash < best.clash - 0.04)
              best = { hex: hex, clash: clash };
          });
          // e.g. red logo on a red team color with a white alt: allow the team's own black/white
          if (best.clash > BAD_CLASH && c.extra.length) {
            c.extra.forEach(function (hex) {
              var clash = clashShare(lums, hex);
              if (clash < best.clash - 0.1) best = { hex: hex, clash: clash };
            });
          }
          return "#" + best.hex;
        }

        // Read the logo's pixels (needs CORS; returns null if the browser won't allow it).
        var lumCache = {},
          bgCache = {};
        function logoLums(img, url) {
          if (url in lumCache) return lumCache[url];
          var out = null;
          try {
            var cv = document.createElement("canvas");
            cv.width = cv.height = 32;
            var ctx = cv.getContext("2d");
            ctx.drawImage(img, 0, 0, 32, 32);
            var d = ctx.getImageData(0, 0, 32, 32).data,
              lums = [],
              i;
            for (i = 0; i < d.length; i += 4) {
              if (d[i + 3] > 128) lums.push(lumRGB(d[i], d[i + 1], d[i + 2]));
            }
            out = lums.length ? lums : null;
          } catch (e) {
            out = null;
          }
          lumCache[url] = out;
          return out;
        }

        function logoOf(team) {
          if (team.logo) return team.logo;
          if (team.logos && team.logos.length) return team.logos[0].href;
          return "";
        }

        // ESPN's own Game Center link from the API, with a constructed fallback.
        function gameLink(ev, league) {
          var links = ev.links || [];
          var pick = null,
            i,
            rel;
          for (i = 0; i < links.length; i++) {
            rel = links[i].rel || [];
            if (
              rel.indexOf("summary") !== -1 &&
              rel.indexOf("desktop") !== -1
            ) {
              pick = links[i];
              break;
            }
          }
          if (!pick) {
            for (i = 0; i < links.length; i++) {
              rel = links[i].rel || [];
              if (rel.indexOf("summary") !== -1) {
                pick = links[i];
                break;
              }
            }
          }
          if (pick && pick.href) return pick.href;
          return "https://www.espn.com/" + league.web + "/_/gameId/" + ev.id;
        }

        async function fetchLeague(league) {
          var now = new Date();
          // plain scoreboard endpoint; today's games are filtered in JS below
          var url = API + league.path + "/scoreboard";
          var res = await fetch(url);
          if (!res.ok) throw new Error(league.key + " " + res.status);
          var data = await res.json();
          var seen = {},
            out = [];
          (data.events || []).forEach(function (ev) {
            try {
              if (seen[ev.id]) return;
              seen[ev.id] = true;
              if (!sameLocalDay(new Date(ev.date), now)) return;
              var comp = ev.competitions[0];
              var home = comp.competitors.filter(function (c) {
                return c.homeAway === "home";
              })[0];
              var away = comp.competitors.filter(function (c) {
                return c.homeAway === "away";
              })[0];
              out.push({
                id: league.key + ev.id,
                date: ev.date,
                state: ev.status.type.state,
                href: gameLink(ev, league),
                home: {
                  cands: candidatesFor(home.team),
                  logo: logoOf(home.team),
                },
                away: {
                  cands: candidatesFor(away.team),
                  logo: logoOf(away.team),
                },
              });
            } catch (e) {
              /* skip malformed event */
            }
          });
          out.sort(function (a, b) {
            var s =
              (STATE_ORDER[a.state] === undefined ? 3 : STATE_ORDER[a.state]) -
              (STATE_ORDER[b.state] === undefined ? 3 : STATE_ORDER[b.state]);
            return s || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
          });
          return out;
        }

        async function load() {
          var results = await Promise.all(
            LEAGUES.map(function (l) {
              return fetchLeague(l).catch(function () {
                return null;
              });
            }),
          );
          // if everything failed (offline), keep what's on screen
          if (
            results.every(function (r) {
              return r === null;
            })
          )
            return;
          games = [].concat.apply(
            [],
            results.map(function (r) {
              return r || [];
            }),
          );
          render(true);
        }

        // Choose how many rows so tiles come out close to 2:1 (two squares side by side),
        // then spread games over the rows as evenly as possible so the page is always full.
        function pickRows(n, W, H) {
          var best = 1,
            bestScore = Infinity,
            r;
          for (r = 1; r <= n; r++) {
            var perRow = Math.ceil(n / r);
            var aspect = W / perRow / (H / r);
            var score = Math.abs(Math.log(aspect / 2));
            if (score < bestScore) {
              bestScore = score;
              best = r;
            }
          }
          return best;
        }

        function makeCell(side) {
          var cell = document.createElement("div");
          cell.className = "cell";
          var key =
            side.logo +
            "|" +
            side.cands.list.join(",") +
            "|" +
            side.cands.extra.join(",");
          // provisional color (alt first) until the logo has loaded and been checked
          cell.style.background = bgCache[key] || "#" + side.cands.list[0];
          if (side.logo) {
            var img = document.createElement("img");
            img.alt = "";
            img.draggable = false;
            img.crossOrigin = "anonymous"; // lets us read pixels to check contrast
            img.onload = function () {
              if (bgCache[key]) return;
              var bg = pickBg(side.cands, logoLums(img, side.logo));
              bgCache[key] = bg;
              cell.style.background = bg;
            };
            img.onerror = function () {
              if (img.crossOrigin) {
                // CDN refused CORS: show the logo without the check
                img.removeAttribute("crossorigin");
                img.src = side.logo;
              }
            };
            img.src = side.logo;
            cell.appendChild(img);
          }
          return cell;
        }

        function makeTile(g) {
          var a = document.createElement("a");
          a.className = "tile";
          a.href = g.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.setAttribute("aria-label", "Open game in ESPN Game Center");
          a.appendChild(makeCell(g.home));
          a.appendChild(makeCell(g.away));
          return a;
        }

        function render(fromData) {
          var sig =
            games
              .map(function (g) {
                return g.id + g.state;
              })
              .join("|") +
            "@" +
            window.innerWidth +
            "x" +
            window.innerHeight;
          if (fromData && sig === signature) return; // nothing changed, avoid flicker
          signature = sig;

          gridEl.textContent = "";
          var n = games.length;
          emptyEl.classList.toggle("show", n === 0);
          if (!n) return;

          var rows = pickRows(n, window.innerWidth, window.innerHeight);
          var base = Math.floor(n / rows),
            extra = n % rows,
            idx = 0,
            r,
            c;
          for (r = 0; r < rows; r++) {
            var count = base + (r < extra ? 1 : 0);
            var row = document.createElement("div");
            row.className = "row";
            for (c = 0; c < count; c++) row.appendChild(makeTile(games[idx++]));
            gridEl.appendChild(row);
          }
        }

        var resizeTimer;
        window.addEventListener("resize", function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            render(false);
          }, 120);
        });

        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) load();
        });

        load();
        setInterval(load, REFRESH_MS);
      })();
    </script>
  </body>
</html>
